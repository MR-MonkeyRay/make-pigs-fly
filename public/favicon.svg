<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sk" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffc6de" />
      <stop offset="1" stop-color="#ffa2c7" />
    </linearGradient>
    <clipPath id="hc">
      <path d="M 32,13 C 46,13 56,21 57.5,34 C 59,46 53,58 32,59 C 11,58 5,46 6.5,34 C 8,21 18,13 32,13 Z" />
    </clipPath>
    <clipPath id="el">
      <ellipse cx="19.5" cy="36" rx="6.2" ry="8" />
    </clipPath>
    <clipPath id="er">
      <ellipse cx="44.5" cy="36" rx="6.2" ry="8" />
    </clipPath>
  </defs>

  <!-- Paper-coloured round badge with thin plum outline -->
  <circle cx="32" cy="32" r="30.5" fill="#f4eedf" stroke="#4a1d3a" stroke-width="2.4" />

  <!-- Matching front-facing happy pig head -->
  <g transform="translate(32 33.5) scale(0.84) translate(-32 -32)">
    <!-- Mirror-symmetric soft leaf/teardrop ears -->
    <path
      d="M 11,22 C 6.5,17 5.5,10 8.5,6.5 C 12,3.5 18,6 21,12.5 C 23,16.5 22.5,20.5 20,22.5 Z"
      fill="url(#sk)"
      stroke="#4a1d3a"
      stroke-width="3.3"
      stroke-linejoin="round"
    />
    <path
      d="M 12.2,19.5 C 9.6,16 9.2,11.6 11,9.5 C 13,7.8 16.4,9.5 18.2,13.6 C 19.3,16 19,18.6 17.5,20 Z"
      fill="#f580b4"
    />
    <path
      d="M 53,22 C 57.5,17 58.5,10 55.5,6.5 C 52,3.5 46,6 43,12.5 C 41,16.5 41.5,20.5 44,22.5 Z"
      fill="url(#sk)"
      stroke="#4a1d3a"
      stroke-width="3.3"
      stroke-linejoin="round"
    />
    <path
      d="M 51.8,19.5 C 54.4,16 54.8,11.6 53,9.5 C 51,7.8 47.6,9.5 45.8,13.6 C 44.7,16 45,18.6 46.5,20 Z"
      fill="#f580b4"
    />

    <!-- Head -->
    <path d="M 32,13 C 46,13 56,21 57.5,34 C 59,46 53,58 32,59 C 11,58 5,46 6.5,34 C 8,21 18,13 32,13 Z" fill="url(#sk)" />
    <g clip-path="url(#hc)">
      <path d="M 4,41 C 14,52 50,52 60,41 L 62,62 L 2,62 Z" fill="#f28ab5" opacity="0.72" />
      <ellipse cx="21" cy="21.5" rx="7" ry="3" fill="#fff0f6" opacity="0.92" transform="rotate(-18 21 21.5)" />
    </g>
    <path
      d="M 32,13 C 46,13 56,21 57.5,34 C 59,46 53,58 32,59 C 11,58 5,46 6.5,34 C 8,21 18,13 32,13 Z"
      fill="none"
      stroke="#4a1d3a"
      stroke-width="3.4"
      stroke-linejoin="round"
    />

    <!-- Forehead cowlick tuft -->
    <path
      d="M 27.5,14 C 24.5,9.5 26,5.5 30,5 C 28.5,8 29,11 31,13.5"
      fill="#ffb3d1"
      stroke="#4a1d3a"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 29,14 C 27.5,7.5 33,3.5 38.5,6 C 41.5,7.5 41,11 38,11 C 39.5,9 37.5,7.5 34.8,9 C 32.5,10.2 33,13 34,14"
      fill="#ffb3d1"
      stroke="#4a1d3a"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path d="M 28.5,14.3 Q 31.5,13.5 34.2,14.3" stroke="#ffc3dc" stroke-width="3.8" stroke-linecap="round" fill="none" />

