    <ellipse cx="12" cy="45.5" rx="5.2" ry="3" fill="#ff5296" opacity="0.5" />
    <ellipse cx="52" cy="45.5" rx="5.2" ry="3" fill="#ff5296" opacity="0.5" />

    <!-- Left eye (happy) -->
    <ellipse cx="19.5" cy="36" rx="6.2" ry="8" fill="#ffffff" />
    <g clip-path="url(#el)">
      <ellipse cx="19.5" cy="36.2" rx="4.7" ry="6.2" fill="#2a0d28" />
      <path d="M 16.3,39.2 Q 19.5,42.4 22.7,39.2 Q 19.5,40.8 16.3,39.2 Z" fill="#f4a4d8" opacity="0.85" />
      <circle cx="17.8" cy="33.5" r="2.3" fill="#ffffff" />
      <circle cx="21.3" cy="38.6" r="1.05" fill="#ffffff" />
    </g>
    <ellipse cx="19.5" cy="36" rx="6.2" ry="8" fill="none" stroke="#4a1d3a" stroke-width="2.3" />
    <path d="M 13.4,33.6 C 15,26.8 24,26.8 25.6,33.6 C 23.3,29.2 15.7,29.2 13.4,33.6 Z" fill="#4a1d3a" />
    <path d="M 13.9,32.2 L 10.6,30.2 M 13.4,34.2 L 10.4,33.2" stroke="#4a1d3a" stroke-width="2.1" stroke-linecap="round" fill="none" />

    <!-- Right eye (happy) -->
    <ellipse cx="44.5" cy="36" rx="6.2" ry="8" fill="#ffffff" />
    <g clip-path="url(#er)">
      <ellipse cx="44.5" cy="36.2" rx="4.7" ry="6.2" fill="#2a0d28" />
      <path d="M 41.3,39.2 Q 44.5,42.4 47.7,39.2 Q 44.5,40.8 41.3,39.2 Z" fill="#f4a4d8" opacity="0.85" />
      <circle cx="42.8" cy="33.5" r="2.3" fill="#ffffff" />
      <circle cx="46.3" cy="38.6" r="1.05" fill="#ffffff" />
    </g>
    <ellipse cx="44.5" cy="36" rx="6.2" ry="8" fill="none" stroke="#4a1d3a" stroke-width="2.3" />
    <path d="M 38.4,33.6 C 40,26.8 49,26.8 50.6,33.6 C 48.3,29.2 40.7,29.2 38.4,33.6 Z" fill="#4a1d3a" />
    <path d="M 50.1,32.2 L 53.4,30.2 M 50.6,34.2 L 53.6,33.2" stroke="#4a1d3a" stroke-width="2.1" stroke-linecap="round" fill="none" />

    <!-- Relaxed eyebrows -->
    <path d="M 14.5,24.6 Q 19.5,22.2 24.5,24.6 M 39.5,24.6 Q 44.5,22.2 49.5,24.6" stroke="#4a1d3a" stroke-width="2.7" stroke-linecap="round" fill="none" />

    <!-- Button snout -->
    <ellipse cx="32" cy="43.5" rx="8.4" ry="5.8" fill="#ff86bc" stroke="#4a1d3a" stroke-width="2.6" />
    <ellipse cx="30.4" cy="40.5" rx="3.4" ry="1.3" fill="#ffffff" opacity="0.65" />
    <ellipse cx="29.1" cy="43.8" rx="1.6" ry="2.5" fill="#591439" transform="rotate(-7 29.1 43.8)" />
    <ellipse cx="34.9" cy="43.8" rx="1.6" ry="2.5" fill="#591439" transform="rotate(7 34.9 43.8)" />

    <!-- Happy calm smile -->
    <path d="M 27.5,51.2 Q 32,55.2 36.5,51.2" stroke="#4a1d3a" stroke-width="2.6" stroke-linecap="round" fill="none" />
