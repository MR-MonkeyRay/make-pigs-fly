    <style>
      :root {
        --paper: #f4eedf;
        --ink: #221e24;
        --pink: #ff48b0;
        --pink-deep: #e2288e;
        --blue: #0078bf;
        --yellow: #ffe800;
        --mud: #925f52;
        --display: 'Fraunces', Georgia, serif;
        --mono: 'Space Mono', ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      :root:lang(zh) {
        --display: 'Fraunces', 'ZCOOL QingKe HuangYou', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --mono: 'Space Mono', ui-monospace, 'PingFang SC', 'Microsoft YaHei', monospace;
      }
      :root:lang(ja) {
        --display: 'Fraunces', 'Mochiy Pop One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
        --mono: 'Space Mono', ui-monospace, 'Hiragino Sans', 'Yu Gothic', monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100svh;
        display: grid;
        grid-template-rows: 1fr auto;
        background:
          radial-gradient(circle at 1px 1px, rgba(0, 120, 191, 0.16) 1px, transparent 1.4px) 0 0 / 9px 9px,
          linear-gradient(#cfe6f3, var(--paper) 70%);
        color: var(--ink);
        font-family: var(--mono);
        overflow-x: hidden;
      }
      main {
        width: min(980px, 100%);
        margin: 0 auto;
        padding: clamp(28px, 7vh, 80px) 20px 0;
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(16px, 4vw, 48px);
      }
      .kicker {
        margin: 0 0 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--blue);
      }
      h1 {
        margin: 0;
        font-family: var(--display);
        font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144;
        font-weight: 900;
        font-size: clamp(38px, 6.4vw, 76px);
        line-height: 0.98;
        letter-spacing: -0.02em;
        text-shadow:
          3px 3px 0 var(--pink),
          -1px -1px 0 rgba(0, 120, 191, 0.55);
      }
      :lang(zh) h1,
      :lang(ja) h1 {
        letter-spacing: 0;
        line-height: 1.15;
      }
      .sub {
        margin: 18px 0 26px;
        font-size: 14px;
        line-height: 1.55;
        max-width: 36em;
      }
      .home {
        display: inline-block;
        padding: 14px 22px;
        border: 3px solid var(--ink);
        border-radius: 14px;
        background: var(--yellow);
        color: var(--ink);
        font-family: var(--display);
        font-variation-settings: 'SOFT' 100, 'WONK' 1;
        font-weight: 900;
        font-size: 22px;
        text-decoration: none;
        box-shadow: 5px 5px 0 var(--pink);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .home:hover,
      .home:focus-visible {
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0 var(--pink);
        outline: none;
      }
      .scene {
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .hover {
        animation: hover 2.4s ease-in-out infinite;
      }
      .wing {
        transform-origin: 100% 100%;
        transform-box: fill-box;
        animation: flap 0.5s ease-in-out infinite alternate;
      }
      .q {
        animation: blink 1.6s steps(2) infinite;
      }
      @keyframes hover {
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes flap {
        to {
          transform: rotate(-24deg);
        }
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }
      footer {
        margin-top: 28px;
        padding: 22px 20px 26px;
        background: var(--mud);
        border-top: 12px solid #00a95c;
        color: var(--paper);
        text-align: center;
        font-size: 11px;
      }
      footer p {
        margin: 0;
        opacity: 0.85;
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
          text-align: left;
        }
        .art {
          order: -1;
          width: min(260px, 70vw);
          margin: 0 auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hover,
        .wing,
        .q {
          animation: none;
        }
      }
    </style>
